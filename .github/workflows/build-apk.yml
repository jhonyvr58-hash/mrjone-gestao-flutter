name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold and configure Android project
        run: |
          if [ ! -d "android" ]; then
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            flutter create . --platforms android --org com.mrjone --project-name mrjone_gestao
            cp /tmp/pubspec.yaml.bak pubspec.yaml
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          for path_str in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(path_str)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              is_kts = path_str.endswith(".kts")

              if is_kts:
                  if "isCoreLibraryDesugaringEnabled" not in text:
                      if re.search(r"compileOptions\s*\{", text):
                          text = re.sub(
                              r"(compileOptions\s*\{)",
                              r"\1\n        isCoreLibraryDesugaringEnabled = true",
                              text,
                              count=1,
                          )
                      else:
                          text += "\nandroid {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n}\n"

                  dep_line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
                  if "coreLibraryDesugaring(" not in text:
                      if re.search(r"dependencies\s*\{", text):
                          text = re.sub(
                              r"(dependencies\s*\{)",
                              r"\1\n" + dep_line,
                              text,
                              count=1,
                          )
                      else:
                          text += f"\ndependencies {{\n{dep_line}\n}}\n"
              else:
                  if "coreLibraryDesugaringEnabled" not in text:
                      if re.search(r"compileOptions\s*\{", text):
                          text = re.sub(
                              r"(compileOptions\s*\{)",
                              r"\1\n        coreLibraryDesugaringEnabled true",
                              text,
                              count=1,
                          )
                      else:
                          text += "\nandroid {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n}\n"

                  dep_line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
                  if "coreLibraryDesugaring " not in text:
                      if re.search(r"dependencies\s*\{", text):
                          text = re.sub(
                              r"(dependencies\s*\{)",
                              r"\1\n" + dep_line,
                              text,
                              count=1,
                          )
                      else:
                          text += f"\ndependencies {{\n{dep_line}\n}}\n"

              p.write_text(text, encoding="utf-8")

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              m_text = manifest_path.read_text(encoding="utf-8")
              needed = [
                  "android.permission.INTERNET",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
                  "android.permission.WAKE_LOCK",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
              ]
              perms = [
                  f'<uses-permission android:name="{perm}"/>'
                  for perm in needed
                  if perm not in m_text
              ]
              if perms and "<manifest" in m_text:
                  idx = m_text.find(">", m_text.find("<manifest"))
                  if idx != -1:
                      insert_block = "\n    " + "\n    ".join(perms)
                      m_text = m_text[:idx+1] + insert_block + m_text[idx+1:]
                      manifest_path.write_text(m_text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrjone-gestao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
